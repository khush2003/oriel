version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "type: chore"]
    # A week's wait before taking a new version, so a hijacked release is usually pulled first.
    # Security updates don't wait.
    cooldown:
      default-days: 7
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "type: chore"]
    # Actions are pinned to commit SHAs; Dependabot moves the SHA and the version comment together.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
