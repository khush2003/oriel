name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v4
      - name: Tag matches versionName
        run: |
          version=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match versionName $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=" >> "$GITHUB_ENV" ;; esac
      - name: versionCode is higher than the last release's
        run: |
          code=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          last=$(git tag --list 'v*' --sort=-creatordate | { grep -vx "$GITHUB_REF_NAME" || true; } | head -1)
          if [ -n "$last" ]; then
            prev=$(git show "$last:app/build.gradle.kts" | sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p')
            [ "$code" -gt "$prev" ] || { echo "versionCode $code isn't higher than $last's $prev"; exit 1; }
          fi
      - run: scripts/check-guardrails.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "KEYSTORE_BASE64 is not set; refusing to publish a debug-signed release"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Test
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Build
        env:
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/Oriel-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum *.apk) > dist/SHA256SUMS.txt
          notes="Most phones: **arm64-v8a**. Older 32-bit phones: armeabi-v7a. Not sure: **universal** runs on any device.

          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`"
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt --draft $PRERELEASE \
            --title "Oriel $VERSION" --notes "$notes"
      - name: Remove the keystore
        if: always()
        run: rm -f release.jks keystore.properties
