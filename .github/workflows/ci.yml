name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope, privacy and hygiene checks
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-guardrails.sh

  build:
    name: Build, test and lint
    needs: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 runs the tests (InnerTubeX ships Java 21 bytecode); 17, listed last, runs Gradle.
          java-version: |
            21
            17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit, Robolectric and screenshot tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Keep screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/screenshots/
            app/build/reports/
            core/build/reports/
          retention-days: 14
      - name: Keep the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: oriel-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
